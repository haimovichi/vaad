<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ועד הבית — מצב תשלומים</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#6b7685;--line:#e3e7ec;--paid:#2e9d5b;--partial:#e0a100;--unpaid:#d64545;--pending:#f0c14b;--future:#d5dbe2;--pre:#3b82c4;--accbg:#e6effc;--acc:#2456a6;--badbg:#fdecec;--okbg:#e5f4ea;--warnbg:#fdf1d6}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e8edf3;--mute:#8d99a8;--line:#2a333f;--future:#323c49;--accbg:#1c2d4a;--acc:#9cc0f5;--badbg:#3a1f22;--okbg:#17321f;--warnbg:#3a3018}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 28px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:20px;margin:4px 0}
.sub{color:var(--mute);font-size:13px}
.sub a{color:var(--acc);text-decoration:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.tools a{font-size:13px;color:var(--acc);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;text-decoration:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.sum small{display:block;color:var(--mute);font-size:12px}
.sum b{font-size:22px;font-weight:600}
.bad{color:var(--unpaid)}
input[type=search],select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{width:100%;margin-top:8px}
.tabs{display:flex;gap:6px;margin:8px 0;align-items:center}
.tab{flex:1;border:1px solid var(--line);border-radius:999px;padding:8px 6px;font:inherit;font-size:15px;background:var(--card);color:var(--mute);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accbg);color:var(--acc);border-color:var(--acc);font-weight:600}
.tabs select{padding:7px 8px;border-radius:999px;font-size:14px}
.mlabels{display:flex;gap:3px;padding:0 13px;margin-top:6px;font-size:10px;color:var(--mute)}
.mlabels span{flex:1;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.top{display:flex;align-items:center;gap:10px}
.num{min-width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600}
.who{flex:1;min-width:0;line-height:1.25}
.who small{display:block;color:var(--mute);font-size:12px}
.badge{font-size:13px;padding:3px 9px;border-radius:7px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--paid)}.b-bad{background:var(--badbg);color:var(--unpaid)}.b-warn{background:var(--warnbg);color:#a67700}.b-pre{background:var(--accbg);color:var(--acc)}.b-wait{background:var(--warnbg);color:#a67700}.b-old{background:var(--bg);color:var(--mute)}
.strip{display:flex;gap:3px;margin-top:9px}
.strip i{flex:1;height:9px;border-radius:3px;background:var(--future)}
i.paid{background:var(--paid)}i.partial{background:var(--partial)}i.unpaid{background:var(--unpaid)}i.pending{background:var(--pending)}i.prepaid{background:var(--pre)}i.na{background:var(--line);opacity:.5}
.more{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);cursor:default}
.card.open .more{display:block}
.pays{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.pays h3{font-size:15px;margin:0 0 6px}
table.p{width:100%;border-collapse:collapse}
table.p th{color:var(--mute);font-weight:500;font-size:12px;text-align:right;padding:3px 2px}
table.p td{padding:5px 2px;border-top:1px solid var(--line)}
table.p td.n{font-variant-numeric:tabular-nums;font-weight:600}
table.p tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.foot{color:var(--mute);font-size:12px;margin-top:6px}
.res{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.res small{display:block;color:var(--mute);font-size:12px}
.res:first-of-type{border-top:0}
a.tel{color:var(--acc);text-decoration:none;direction:ltr;unicode-bidi:embed;white-space:nowrap}
details.old{margin-top:12px}
details.old summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:16px 0 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.empty{color:var(--mute);text-align:center;padding:24px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><span class="sub" id="updated"></span></div>
  <div class="sub" style="margin-bottom:4px"><span id="who"></span> · <a href="#" id="logout">יציאה</a></div>
  <div class="tools" id="tools"></div>
  <div class="sum" id="sum"></div>

  <div class="tabs">
    <button class="tab" data-t="mine">הדירה שלי</button>
    <button class="tab" data-t="debt">חייבים</button>
    <button class="tab" data-t="all">הכל</button>
    <select id="year" aria-label="שנה"></select>
  </div>
  <input type="search" id="q" placeholder="חפש דירה" hidden>
  <div class="mlabels" id="mlabels"></div>
  <div id="list"></div>
  <details class="old" id="oldBox"><summary id="oldSum"></summary><div id="oldList"></div></details>

  <div class="legend">
    <span><i style="background:var(--paid)"></i>שולם</span><span><i style="background:var(--partial)"></i>חלקי</span><span><i style="background:var(--unpaid)"></i>לא שולם</span>
    <span><i style="background:var(--pending)"></i>החודש, טרם שולם</span><span><i style="background:var(--pre)"></i>שולם מראש</span><span><i style="background:var(--future)"></i>עוד לא הגיע</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="vaad-lib.js"></script>
<script src="common.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('he-IL');
const fdate=d=>d?d.split('-').reverse().join('/'):'—';
const MN=['ינו','פבר','מרץ','אפר','מאי','יוני','יולי','אוג','ספט','אוק','נוב','דצמ'];
const MF=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const calc=VaadLib.calc;

const ME=await Vaad.whoami();
if(!ME||!ME.building){Vaad.go('index.html');return}
const BLD=ME.building;
const STAFF=BLD.manage;            // committee, buildings manager or super user: the building's full data
const BOARD=BLD.seesBoard;         // may see every apartment's status (managers and tenants)
const myApts=BLD.linkedApts;       // apartments the owner of the building linked to this login (as tenant or apartment owner)
const store=Vaad.store(BLD.id,ME);
let DB=null,SNAP=null;
try{ if(STAFF)DB=await store.load(); else SNAP=await store.getBoard(); }
catch(e){document.body.innerHTML='<div class="wrap">שגיאה בטעינה: '+e.message+'</div>';return}
if(!STAFF&&!SNAP){document.body.innerHTML='<div class="wrap">עדיין לא פורסם מידע. נסו שוב מאוחר יותר.</div>';return}

/* ---- header ---- */
$('#who').textContent=ME.email+' · '+BLD.roles.map(r=>Vaad.ROLE_LABEL[r]).join(', ');
$('#logout').onclick=e=>{e.preventDefault();Vaad.signOut()};
$('#title').textContent=STAFF?BLD.name:SNAP.title;
$('#updated').textContent=STAFF?'':'עודכן '+SNAP.updated.split('-').reverse().join('/');
if(ME.memberships.length>1){const sel=document.createElement('select');sel.style.cssText='font:inherit;padding:2px 6px;margin-inline-end:8px';$('#who').before(sel);Vaad.mountSwitcher(sel,ME)}
if(STAFF){
  const L=[['מצב תשלומים (טבלה)','admin.html#status'],['ייבוא מהבנק','admin.html#import'],['דירות ודיירים','admin.html#apts'],['מה הדיירים רואים','admin.html#share'],['משתמשים','admin.html#users'],['גיבוי','admin.html#backup']];
  if(ME.isSuper||ME.isManager)L.push(['בניינים','admin.html#buildings']);
  if(ME.isSuper)L.push(['מנהלי בניינים','admin.html#managers']);
  $('#tools').innerHTML=L.map(([t,h])=>`<a href="${h.replace('.html','.html'+Vaad.keep)}">${t}</a>`).join('');
}

/* ---- data ---- */
const now=STAFF?calc.fromMi(calc.nowMi()):SNAP.now;
const years=STAFF?Array.from({length:now.y-calc.fromMi(calc.START).y+1},(_,i)=>calc.fromMi(calc.START).y+i):SNAP.years;
let year=now.y,tab=myApts.length?'mine':'debt',openId=null;
const tabEl=t=>document.querySelector(`.tab[data-t="${t}"]`);
tabEl('mine').hidden=!myApts.length;tabEl('mine').textContent=myApts.length>1?'הדירות שלי':'הדירה שלי';
tabEl('debt').hidden=!BOARD;tabEl('all').hidden=!BOARD;   // an apartment owner who is not also a tenant sees only their own apartments
for(const y of years)$('#year').add(new Option(y,y));$('#year').value=year;
$('#mlabels').innerHTML=MN.map(m=>`<span>${m[0]}</span>`).join('');

function rowsFor(y){
  if(STAFF){
    const g=calc.grid(DB,y);const cnt={};g.forEach(r=>cnt[r.apt]=(cnt[r.apt]||0)+1);
    return g.map(r=>({apt:r.apt,key:r.key,name:r.name,tag:cnt[r.apt]>1?(r.left?'דייר קודם':'דייר נוכחי'):undefined,left:r.left,debt:r.debt,months:r.months.map(c=>c.status)}));
  }
  return (SNAP.grids[y]||[]).map(r=>({...r,left:r.tag==='דייר קודם'}));
}
function staffPayments(row,y){
  const ts=calc.tenancies(DB);const t=ts.find(x=>x.key===row.key);
  return DB.payments.filter(p=>p.y===y&&(ts.find(x=>x.key===p.key)||calc.tenancyAt(ts,p.apt,calc.mi(p.y,p.m)))===t)
    .map(p=>({y:p.y,m:p.m,amount:p.amount,method:p.method,date:p.date})).sort((a,b)=>a.m-b.m||String(a.date).localeCompare(String(b.date)));
}
// current tenants (names, phones) of the apartments this person owns
async function tenantsOfMyApartments(){
  const owned=new Set(BLD.ownerApts);
  if(!owned.size)return [];
  if(STAFF)return DB.residents.filter(r=>owned.has(r.apt)&&r.status!=='עזב');
  return store.getAptTenants();
}
const telLink=p=>p?`<a class="tel" href="tel:${p.replace(/[^\d+]/g,'')}">${p}</a>`:'';
function tenantsBox(list,apt){
  const here=list.filter(r=>r.apt===apt);
  if(!here.length)return'<div class="pays"><h3>הדייר בדירה</h3><div class="foot">אין דייר רשום בדירה כרגע.</div></div>';
  return`<div class="pays"><h3>הדייר בדירה</h3>`+here.map(r=>`<div class="res"><div>${r.first} ${r.last}${r.first2?` ו${r.first2} ${r.last2||r.last}`:''}<small>${r.role||''}</small></div><div>${telLink(r.phone1)}${r.phone2?'<br>'+telLink(r.phone2):''}</div></div>`).join('')+`</div>`;
}

/* ---- pieces ---- */
const isOwing=r=>r.debt>0||(r.debt===undefined&&r.months.some(s=>s==='unpaid'||s==='partial'));
function badge(r){
  const cur=r.months[now.m-1];
  if(r.debt>0)return`<span class="badge ${cur==='partial'?'b-warn':'b-bad'}">חוב ${fmt(r.debt)} ₪</span>`;
  if(r.debt===undefined&&isOwing(r))return`<span class="badge b-bad">חסר תשלום</span>`;
  if(r.left)return`<span class="badge b-old">שולם</span>`;
  if(cur==='pending'&&year===now.y)return`<span class="badge b-wait">ממתין לחודש זה</span>`;
  if(r.months.includes('prepaid'))return`<span class="badge b-pre">שולם מראש</span>`;
  return`<span class="badge b-ok">שולם</span>`;
}
function missing(r){
  const m=r.months.map((s,i)=>(s==='unpaid'||s==='partial'?MF[i]+(s==='partial'?' (חלקי)':''):null)).filter(Boolean);
  if(m.length)return'חסר: '+m.join(', ')+'.';
  if(r.debt>0)return'יש חוב מחודשים בשנים קודמות.';
  if(r.months[now.m-1]==='pending'&&year===now.y)return'החודש הנוכחי טרם שולם.';
  return'הכל שולם עד היום.';
}
function payTable(list,title){
  if(!list.length)return`<div class="pays"><h3>${title}</h3><div class="foot">אין תשלומים רשומים בשנת ${year}.</div></div>`;
  const total=list.reduce((s,p)=>s+p.amount,0);
  const undated=list.some(p=>!p.date);
  return`<div class="pays"><h3>${title}</h3><table class="p"><tr><th>תאריך</th><th>עבור חודש</th><th>סכום</th><th>אמצעי</th></tr>`+
    list.map(p=>`<tr><td>${fdate(p.date)}</td><td>${MF[p.m-1]}</td><td class="n">${fmt(p.amount)} ₪</td><td>${p.method||''}</td></tr>`).join('')+
    `<tr class="tot"><td colspan="2">סה״כ שולם</td><td class="n">${fmt(total)} ₪</td><td></td></tr></table>`+
    (undated?'<div class="foot">תשלומים שנרשמו לפני המעבר לאפליקציה מוצגים בלי תאריך.</div>':'')+`</div>`;
}
const idOf=r=>r.key||(r.apt+'|'+(r.tag||''));
function card(r,withMore){
  const open=withMore&&openId===idOf(r);
  let more='';
  if(withMore)more=`<div class="more">${missing(r)}${STAFF&&open?payTable(staffPayments(r,year),'תשלומים ב-'+year):''}</div>`;
  return`<div class="card ${open?'open':''}" data-id="${idOf(r)}"><div class="top"><div class="num">${r.apt}</div>
    <div class="who">${r.name||'דירה '+r.apt}<small>${r.tag||''}</small></div>${badge(r)}</div>
    <div class="strip">${r.months.map((s,i)=>`<i class="${s}" title="${MF[i]}"></i>`).join('')}</div>${more}</div>`;
}

/* ---- render ---- */
let seq=0;
async function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const all=rowsFor(year);
  const current=all.filter(r=>!r.left);
  const idx=now.m-1;
  const paidNow=current.filter(r=>['paid','prepaid'].includes(r.months[idx])).length;
  const owing=new Set(all.filter(isOwing).map(r=>r.apt)).size;
  $('#sum').innerHTML=BOARD&&year===now.y?`<div><small>שילמו ${MF[idx]}</small><b>${paidNow} מתוך ${current.length}</b></div><div><small>דירות עם חוב</small><b class="${owing?'bad':''}">${owing}</b></div>`:'';
  $('#q').hidden=tab!=='all';
  $('#mlabels').style.display=tab==='mine'&&!myApts.length?'none':'';
  const my=++seq;
  $('#oldBox').style.display='none';

  if(tab==='mine'){
    if(!myApts.length){
      $('#list').innerHTML=`<div class="empty">אין דירה מקושרת לחשבון הזה.<br>${BLD.grantable.includes('tenant')?'אפשר לקשר דירה בלשונית "משתמשים".':'בקשו מוועד הבית לקשר את הדירה שלכם.'}</div>`;
      return;
    }
    const rowOf=a=>current.find(r=>r.apt===a);
    $('#list').innerHTML=myApts.map(a=>`<div class="aptsec" data-apt="${a}">${rowOf(a)?card(rowOf(a),false):`<div class="empty">דירה ${a} לא נמצאה</div>`}<div class="tn"></div><div class="pp"><div class="pays foot">טוען תשלומים…</div></div></div>`).join('');
    let tenants=[],tenErr='';
    try{ tenants=await tenantsOfMyApartments(); }catch(e){ tenErr=e.message; }
    for(const a of myApts){
      const sec=document.querySelector(`.aptsec[data-apt="${a}"]`);if(!sec)continue;
      if(BLD.ownerApts.includes(a))sec.querySelector('.tn').innerHTML=tenErr?`<div class="pays foot">לא הצלחנו לטעון את פרטי הדייר: ${tenErr}</div>`:tenantsBox(tenants,a);
      const title=BLD.tenantApts.includes(a)?'התשלומים שלי ב-'+year:'תשלומי הדייר הנוכחי ב-'+year;
      try{
        const list=STAFF?(rowOf(a)?staffPayments(rowOf(a),year):[]):await store.getAptPayments(a,year);
        if(my!==seq)return;
        sec.querySelector('.pp').innerHTML=payTable(list,title);
      }catch(e){if(my===seq)sec.querySelector('.pp').innerHTML='<div class="pays foot">לא הצלחנו לטעון תשלומים: '+e.message+'</div>'}
    }
    return;
  }

  if(tab==='debt'){
    const owe=all.filter(isOwing).sort((a,b)=>(b.debt||0)-(a.debt||0)||a.apt-b.apt);
    $('#list').innerHTML=owe.map(r=>card(r,true)).join('')||'<div class="empty">אין חייבים. כולם שילמו 🎉</div>';
    return;
  }

  const q=$('#q').value.trim();
  const match=r=>!q||String(r.apt)===q||(r.name||'').includes(q);
  const cur=current.filter(match).sort((a,b)=>(isOwing(b)?1:0)-(isOwing(a)?1:0)||a.apt-b.apt);
  $('#list').innerHTML=cur.map(r=>card(r,true)).join('')||'<div class="empty">לא נמצאו דירות</div>';
  const old=all.filter(r=>r.left&&match(r));
  $('#oldBox').style.display=old.length?'':'none';
  $('#oldSum').textContent=`דיירים קודמים (${old.length})`;
  $('#oldList').innerHTML=old.map(r=>card(r,true)).join('');
}

/* ---- events ---- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;openId=null;render()});
$('#year').onchange=e=>{year=+e.target.value;openId=null;render()};
$('#q').oninput=render;
document.body.addEventListener('click',e=>{
  const c=e.target.closest('.card[data-id]');if(!c)return;
  if(tab==='mine')return;
  openId=openId===c.dataset.id?null:c.dataset.id;render();
});
render();
})();
</script>
</body>
</html>
